name: verify

# The pack is a translation of a moving upstream: it must be checked against a
# pinned harness tag, not against whatever the local checkout happens to hold.
# The gate is deliberately narrow — a dead namespace, a mismatched plural key
# set and a placeholder the template never passes are the failures a key-level
# comparison cannot see.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # A translation rots without anyone touching it: the upstream moves, the pinned
  # tag keeps passing locally, and the drift is only noticed when somebody builds.
  # A weekly run turns that silent decay into a red check on Monday morning.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Bump when the pack is synced to a newer harness release.
      HARNESS_TAG: dsh-v0.2.1-rc.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Export harness packages at the pinned tag
        run: |
          git clone --depth 1 --branch "$HARNESS_TAG" \
            https://github.com/deepseek-ai/deepseek-harness.git harness
          mkdir -p tree
          git -C harness archive "$HARNESS_TAG" packages | tar -x -C tree

      - name: Build
        run: npm run build

      - name: Readme structure, paragraphs and claims
        run: npm run check:readmes

      - name: Plugin manifest rules
        run: npm run check:manifest

      - name: Committed bundle matches the build
        run: npm run check:built

      - name: Advertised package size
        run: npm run check:size

      - name: Typography rules
        run: npm run check:typography

      - name: Typography on a real document
        run: npm run check:typography:dom

      - name: Locale coexistence
        run: npm run check:locale

      - name: Russian plural forms
        run: npm run check:plural

      - name: Composed Russian sentences
        run: npm run check:composition

      - name: Translated namespace inventory
        run: npm run check:namespaces

      - name: README languages move together
        run: npm run check:readmes:pairs

      - name: Compatibility promise
        run: npm run check:peers

      # The meta block claims a set of harness releases; this downloads each one's
      # locale runtime and runs three suites against it. It is the one step that needs
      # the registry, which is why `verify` leaves it out and CI does not.
      - name: Compatibility matrix (downloads each claimed version)
        run: npm run check:compat

      # A check that runs only in `package.json` protects nobody: this reads both
      # workflow files and fails when one of them is missing a check from `verify`.
      - name: Workflows run the verify chain
        run: npm run check:workflows

      - name: Upstream tag watch
        run: npm run check:upstream

      - name: Locale audit
        run: node scripts/audit.mjs tree/packages
