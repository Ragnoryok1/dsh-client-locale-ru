name: publish

# Releases are cut by tag only: npm credentials live in repository secrets, so a
# release never needs a token pasted into a chat, a shell, or a local .npmrc.
# Push a version tag and this workflow does the rest:
#
#   npm version 0.3.0 --no-git-tag-version
#   npm pkg get version
#   git commit -am "release: 0.3.0" && git tag v0.3.0 && git push origin v0.3.0
#
# Before doing that, bump the `deepseek-harness-meta` version in README.md — the
# marketplace reads that field, not the npm tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check but do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  # `npm publish --provenance` signs an attestation with the OIDC token; without this
  # grant the release dies on its last step after every gate has passed.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag_version but package.json says $pkg_version"
            exit 1
          fi

      # The marketplace reads the version from this block, not from npm, and it
      # only reads it once at first listing — so a stale field here is exactly
      # the kind of drift that never announces itself.
      - name: Check the README metadata version matches package.json
        run: |
          node -e "
            const fs = require('node:fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            const block = readme.match(/<!--\s*deepseek-harness-meta\s*([\s\S]*?)-->/);
            if (!block) { console.error('::error::no deepseek-harness-meta block in README.md'); process.exit(1); }
            let meta;
            try { meta = JSON.parse(block[1]); } catch (error) { console.error('::error::meta block is not valid JSON:', error.message); process.exit(1); }
            const pkg = require('./package.json').version;
            if (meta.version !== pkg) {
              console.error('::error::README meta version ' + meta.version + ' != package.json ' + pkg);
              process.exit(1);
            }
            console.log('README meta version ' + meta.version + ' matches package.json');
          "

      # The audit, typography and plural gates run before anything is uploaded,
      # so a release cannot ship a dead namespace or a typo'd separator.
      - name: Typography
        run: npm run check:typography

      - name: Typography on a real document
        run: npm run check:typography:dom

      - name: Russian plural forms
        run: npm run check:plural

      # The meta block promises a list of harness versions; a release is the one
      # moment that promise has to hold, so each of them gets three suites.
      - name: Compatibility with every claimed harness version
        run: npm run check:compat

      - name: Audit against the harness tree
        env:
          HARNESS_TAG: dsh-v0.2.1-rc.2
        run: |
          git clone --depth 1 --branch "$HARNESS_TAG" \
            https://github.com/deepseek-ai/deepseek-harness.git harness
          mkdir -p tree
          git -C harness archive "$HARNESS_TAG" packages | tar -x -C tree
          node scripts/audit.mjs tree/packages

      # The three READMEs describe one document; this gate fails when an edit
      # touches one language and leaves the others behind, or when a number they
      # advertise has drifted from the pack.
      - name: Check the READMEs stay in step
        run: npm run check:readmes

      # A fact fixed in one language and not the other is how «пять случаев» survived
      # until it was six; a release ships all three READMEs to the registry.
      - name: README languages move together
        run: npm run check:readmes:pairs

      # The registry page shows the changelog of whatever version is published; a
      # release without a section for it is a page that describes the release before.
      - name: Changelog describes the released version
        run: npm run check:changelog

      # The shipped inventory is generated from the bundle: a release is the last
      # moment to notice that it no longer matches what the pack registers.
      - name: Translated namespace inventory
        run: npm run check:namespaces

      - name: Plugin manifest rules
        run: npm run check:manifest

      - name: Marketplace metadata matches the package
        run: npm run check:meta

      # The meta block promises a runtime range; a release is the moment that
      # promise is read, so it is checked here as well as on every push.
      - name: Compatibility promise
        run: npm run check:peers

      - name: Upstream tag watch
        run: npm run check:upstream

      # The plugin descriptors a user reads are translated from an English snapshot; this
      # fails when upstream rewrites one, which would leave a Russian title saying something
      # the English no longer says.
      - name: Plugin descriptor translations follow upstream
        run: npm run check:descriptors -- tree/packages

      # The patch that goes to the harness must carry exactly the translations the pack
      # holds; a stale patch would send upstream text the repository no longer has.
      - name: The upstream patch carries the same translations
        run: npm run check:descriptor-patch

      # The release path reads the same workflow files as CI; a check missing here is
      # a check that never runs before `npm publish`.
      - name: Workflows run the verify chain
        run: npm run check:workflows

      - name: Workflow files are parsable
        run: npm run check:workflow-yaml


      - name: A release never fails because its version is already out
        run: npm run check:release-race
      - name: Build
        run: npm run build

      - name: The pack says when it loses the language to another pack
        run: npm run check:conflict-notice

      # What is committed is what a GitHub install runs, so the release ships the
      # bundle that this build produces — not an older one.
      - name: Committed bundle matches the build
        run: npm run check:built

      # A plugin's name comes from the plugin's own locale file, which no dictionary
      # can reach, so the pack carries those names itself and rewrites them in the
      # rendered interface. This proves the rewrite on a real document.
      - name: Plugin names are Russian in the interface
        run: npm run check:plugin-names

      # The map of the third-party plugin names is built from the dictionaries;
      # a map that drifted from them would translate a name the plugin no longer
      # publishes.
      - name: Plugin names match the dictionaries
        run: npm run check:plugin-names:map

      - name: Advertised package size
        run: npm run check:size

      # The release is the one moment the tarball is real.
      - name: Published artifact matches the package
        run: npm run check:tarball

      - name: Show what would be published
        run: npm pack --dry-run

      # A version can already be on the registry — published by hand, or a re-run of this
      # workflow on an older tag. Publishing it again fails the last step after every gate
      # has passed, which reads as a broken release; the guard turns that into a skip.
      - name: Is this version already on the registry
        id: published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # The registry can lag a publish made elsewhere by a couple of minutes, so the question
          # is asked three times before the answer «no» is believed.
          for attempt in 1 2 3; do
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::${name}@${version} is already published — nothing to publish"
              exit 0
            fi
            sleep 20
          done
          echo "exists=false" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: ${{ !inputs.dry-run && steps.published.outputs.exists != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # Who the token belongs to is written into the log: a publish that failed three
          # times in a row for want of a token is indistinguishable from a broken package
          # without it.
          npm whoami || echo "::warning::npm не признал токен публикации"
          if npm publish --access public --provenance; then
            exit 0
          fi
          # The attestation is a promise, not a prerequisite: if the OIDC token cannot be
          # minted or the registry refuses the signature, the release must still go out.
          # The second attempt publishes the same bytes without the signature.
          echo "::warning::публикация с attestation не удалась — пробуем без него"
          if npm publish --access public; then
            echo "::notice::${name}@${version} опубликован без attestation"
            exit 0
          fi
          # A version published a moment ago may not have been visible to the guard; npm then
          # refuses to publish over it. The release is out either way, so the run ends
          # successfully — with the reason in the log.
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is on the registry — the publish lost a race with an earlier release, not with a broken package"
            exit 0
          fi
          exit 1